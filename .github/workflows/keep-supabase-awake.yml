name: Keep Supabase awake
on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours (UTC); GitHub may delay runs by several minutes
  workflow_dispatch: {}      # lets you run it manually from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database through the REST API
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"; cat /tmp/out; echo
          [ "$code" = "200" ]
